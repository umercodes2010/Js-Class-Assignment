<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphone Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Product Image -->
        <img
            id="productImage"
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
            alt="Headphones"
        >

        <!-- Product Name -->
        <h2 id="productName">Premium Headphones</h2>

        <!-- Description -->
        <p id="description">
            High-quality wireless headphones with clear sound
            and comfortable design.
        </p>

        <!-- Price -->
        <h3 id="price">$80</h3>

        <!-- Buy Now -->
        <button id="buyBtn">Buy Now</button>

        <!-- Change Product Image -->
        <button id="changeImageBtn">
            Change Headphone
        </button>

        <!-- Name Input -->
        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
        >

        <!-- Welcome Button -->
        <button id="welcomeBtn">
            Show Welcome
        </button>

        <!-- Welcome Message -->
        <p id="welcomeMessage"></p>

        <!-- Change Product Details -->
        <button id="changeProductBtn">
            Change Product Details
        </button>

    </div>

    <script src="app.js"></script>

</body>
</html>
